[package]
name = "rust_flight_tracker"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.13.4", features = ["blocking", "form", "json"] }
dotenvy = "0.15.7"
serde_json = "1.0.151"
serde = { version = "1.0.229", features = ["derive"] }
serde_repr = "0.1.21"
anyhow = "1.0.104"

[lints.clippy]
pedantic = "warn"